[package]
name = "aiterm-app"
version = "0.1.0"
edition = "2021"
description = "aiterm in its own window: tabs of aiterm.exe in ConPTY, drawn by xterm.js in WebView2"
license = "MIT"

# Windows-only; elsewhere the crate builds to a stub so the workspace still builds in CI.
[target.'cfg(windows)'.dependencies]
tao = "0.37"
wry = "0.57"
portable-pty = "0.9"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_IO","Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"
