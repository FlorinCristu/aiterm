[package]
name = "aiterm-setup"
version = "0.1.0"
edition = "2021"
description = "Single-file Windows installer for aiterm: unpacks the embedded files and runs install.ps1"
license = "MIT"

# Windows-only; elsewhere the crate builds to a stub so the workspace still builds in CI.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"
