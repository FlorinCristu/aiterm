[package]
name = "aiterm"
version = "0.1.0"
edition = "2021"
description = "Fast bash front-end that turns natural language into shell commands via DeepSeek"

[dependencies]
rustyline = "14"
ureq = { version = "2", features = ["json"] }
serde_json = "1"
ctrlc = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1"
